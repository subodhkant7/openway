version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        - export GIT_COMMIT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "27911e0")
        - npm run typecheck
        - npm run lint
        - OPENWAY_STORAGE=memory OPENWAY_ENV=test npm run test
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
