<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 720" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="440" y="42" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Traditional Camera AI vs. OpenWay Assurance</text>
  <text x="440" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Why OpenWay closes the loop from detection to verified physical recovery</text>

  <!-- Column 1: Traditional Camera AI -->
  <g transform="translate(60, 95)" filter="url(#cardShadow)">
    <rect width="340" height="570" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="340" height="48" rx="14" fill="#1e293b"/>
    <text x="170" y="30" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="700">TRADITIONAL CAMERA AI</text>

    <!-- Traditional Flow Nodes -->
    <rect x="50" y="75" width="240" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="170" y="102" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">EVENT</text>

    <line x1="170" y1="119" x2="170" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

    <rect x="50" y="153" width="240" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="170" y="180" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">DETECTION</text>

    <line x1="170" y1="197" x2="170" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

    <rect x="50" y="231" width="240" height="44" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="170" y="258" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">ALERT</text>

    <!-- Traditional Dead End Box -->
    <rect x="30" y="315" width="280" height="210" rx="10" fill="#1e1e2d" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="170" cy="355" r="18" fill="#ef4444" fill-opacity="0.2"/>
    <text x="170" y="362" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="bold">&#10007;</text>
    <text x="170" y="395" text-anchor="middle" fill="#fca5a5" font-size="13" font-weight="700">Workflow Stops at Alert</text>
    <text x="170" y="425" text-anchor="middle" fill="#94a3b8" font-size="11">&#8226; No structured remediation task</text>
    <text x="170" y="448" text-anchor="middle" fill="#94a3b8" font-size="11">&#8226; Unchecked staff claims mark green</text>
    <text x="170" y="471" text-anchor="middle" fill="#94a3b8" font-size="11">&#8226; Ramps remain physically blocked</text>
    <text x="170" y="494" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">False sense of security</text>
  </g>

  <!-- Column 2: OpenWay Assurance -->
  <g transform="translate(480, 95)" filter="url(#cardShadow)">
    <rect width="340" height="570" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect width="340" height="48" rx="14" fill="#0369a1"/>
    <text x="170" y="30" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">OPENWAY ASSURANCE</text>

    <!-- OpenWay Flow Nodes -->
    <!-- 1. EVENT -->
    <rect x="50" y="62" width="240" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="170" y="84" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">EVENT</text>

    <line x1="170" y1="96" x2="170" y2="110" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- 2. EVIDENCE -->
    <rect x="50" y="112" width="240" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="170" y="134" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">EVIDENCE</text>

    <line x1="170" y1="146" x2="170" y2="160" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- 3. OBSERVATION -->
    <rect x="50" y="162" width="240" height="34" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="170" y="184" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">OBSERVATION (Bedrock)</text>

    <line x1="170" y1="196" x2="170" y2="210" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- 4. POLICY -->
    <rect x="50" y="212" width="240" height="34" rx="6" fill="#1e293b" stroke="#0d9488" stroke-width="1.5"/>
    <text x="170" y="234" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="600">POLICY (Gatekeeper)</text>

    <line x1="170" y1="246" x2="170" y2="260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- 5. REMEDIATION -->
    <rect x="50" y="262" width="240" height="34" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="170" y="284" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">REMEDIATION (Staff Task)</text>

    <line x1="170" y1="296" x2="170" y2="310" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- 6. FRESH EVIDENCE -->
    <rect x="50" y="312" width="240" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="334" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">FRESH EVIDENCE (Post-Remediation)</text>

    <line x1="170" y1="346" x2="170" y2="362" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- 7. VERIFIED / UNKNOWN -->
    <rect x="30" y="364" width="280" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="170" y="390" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">VERIFIED RESTORED</text>
    <text x="170" y="408" text-anchor="middle" fill="#a7f3d0" font-size="11">Only after physical proof clears entrance</text>

    <!-- Branch to UNKNOWN -->
    <rect x="30" y="440" width="280" height="54" rx="8" fill="#1e1e2d" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="170" y="462" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">UNKNOWN (If Insufficient Evidence)</text>
    <text x="170" y="480" text-anchor="middle" fill="#94a3b8" font-size="10">Fail-closed: Never hides missing/stale proof</text>

    <!-- Callout -->
    <rect x="30" y="508" width="280" height="42" rx="6" fill="#1e293b"/>
    <text x="170" y="525" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">"Detected is not resolved."</text>
    <text x="170" y="540" text-anchor="middle" fill="#e2e8f0" font-size="10">Resolved is not verified without fresh evidence.</text>
  </g>

  <!-- Bottom Annotation -->
  <text x="440" y="695" text-anchor="middle" fill="#64748b" font-size="12">Amazon Developer Hackathon: Ring Track &amp; AWS Builder Mini-Challenge</text>
</svg>
